id: org.jpminerals.VESTA
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: VESTA

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=GTK_USE_PORTAL=1

modules:
  - name: ruby
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --disable-install-doc
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.6.tar.xz
        sha256: 9c9d121fe3314ea7c801e690b9de981d2b9d12d7849db99c27482468a541ba0a
    cleanup:
      - /ruby/include
      - /ruby/share/man

  - name: unifdef
    buildsystem: simple
    build-commands:
      - sed -i 's/constexpr/const_expr/g' unifdef.c
      - make
      - make prefix=/app install
    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.gz
        sha256: fba564a24db7b97ebe9329713ac970627b902e5e9e8b14e19e024eb6e278d10b

  - name: webkitgtk-4.0
    buildsystem: cmake-ninja
    make-args:
      - -j8
    config-opts:
      - -DPORT=GTK
      - -DUSE_GTK4=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DENABLE_BUBBLEWRAP_SANDBOX=OFF
      - -DUSE_WPE_RENDERER=OFF
      - -DENABLE_GAMEPAD=OFF
      - -DENABLE_SPELLCHECK=OFF
      - -DUSE_WOFF2=OFF
      - -DENABLE_SPEECH_SYNTHESIS=OFF
      - -DUSE_LIBBACKTRACE=OFF
      - -DUSE_SYSTEM_SYSPROF_CAPTURE=NO
    sources:
      - type: archive
        url: https://webkitgtk.org/releases/webkitgtk-2.53.92.tar.xz
        sha256: 2ab7d6b3d586539fac574401a9bfe571c098f85f7835232ae0bc0bae9c9c5bd7
  
  - name: openjdk
    buildsystem: simple
    build-commands:
      - install -d /app/jre
      - cp -a /usr/lib/sdk/openjdk17/* /app/jre/

  - name: glu
    buildsystem: meson
    config-opts:
      - -Dgl_provider=gl
    sources:
      - type: archive
        url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
        sha256: bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f

  - name: wxwidgets
    buildsystem: autotools
    config-opts:
      - --with-gtk=3
      - --with-opengl
      - --enable-shared
      - --disable-debug
      - --disable-tests
      - --disable-webview
      - --without-libjbig
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.11/wxWidgets-3.2.11.tar.bz2
        sha256: 6a129015bce2e914e4bf61ec4411854ad962801d47e92f2eb8340adb6a90af08
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/aclocal
      - /bin/wx-config

  - name: vesta
    buildsystem: simple
    build-commands:
      - install -d /app/lib/VESTA
      - cp -a * /app/lib/VESTA/
      
      - install -d /app/bin
      - |
        cat > /app/bin/VESTA << 'EOF'
        #!/bin/sh
        export PATH="/app/jre/bin:$PATH"
        export JAVA_HOME="/app/jre"
        export LD_LIBRARY_PATH="/app/lib/VESTA:/app/lib/VESTA/PowderPlot:$LD_LIBRARY_PATH"
        export GDK_BACKEND=x11
        cd /app/lib/VESTA
        exec ./VESTA "$@"
        EOF
      - chmod +x /app/bin/VESTA
      - chmod +x /app/lib/VESTA/VESTA /app/lib/VESTA/VESTA-gui /app/lib/VESTA/VESTA-core /app/lib/VESTA/madel /app/lib/VESTA/STRUCTURE_TIDY/structure_tidy
      
      - install -Dm644 /app/lib/VESTA/img/logo.png /app/share/icons/hicolor/256x256/apps/org.jpminerals.VESTA.png
      - install -Dm644 org.jpminerals.VESTA.desktop /app/share/applications/org.jpminerals.VESTA.desktop
    sources:
      - type: archive
        url: https://jp-minerals.org/vesta/archives/testing/VESTA-gtk3-x86_64.tar.xz
        sha256: 119af902715dc1f4f6a65b00f98ba354f57a8aac4ff8fd1cdd03d661050ec397
        strip-components: 1
      - type: file
        path: desktop/org.jpminerals.VESTA.desktop
