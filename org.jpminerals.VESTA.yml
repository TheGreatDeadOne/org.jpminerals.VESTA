id: org.jpminerals.VESTA
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: VESTA

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=GTK_USE_PORTAL=1

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - install -d /app/jre
      - cp -a /usr/lib/sdk/openjdk17/* /app/jre/

  - name: glu
    buildsystem: meson
    config-opts:
      - -Dgl_provider=gl
    sources:
      - type: archive
        url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
        sha256: bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f

  - name: wxwidgets
    buildsystem: autotools
    config-opts:
      - --with-gtk=3
      - --with-opengl
      - --enable-shared
      - --disable-debug
      - --disable-tests
      - --disable-webview
      - --without-libjbig
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.11/wxWidgets-3.2.11.tar.bz2
        sha256: 6a129015bce2e914e4bf61ec4411854ad962801d47e92f2eb8340adb6a90af08
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/aclocal
      - /bin/wx-config

  - name: vesta
    buildsystem: simple
    build-commands:
      - install -d /app/lib/VESTA
      - cp -a * /app/lib/VESTA/
      
      - install -d /app/bin
      - install -m 755 vesta.sh /app/bin/VESTA
      
      - chmod +x /app/lib/VESTA/VESTA /app/lib/VESTA/VESTA-gui /app/lib/VESTA/VESTA-core /app/lib/VESTA/madel /app/lib/VESTA/STRUCTURE_TIDY/structure_tidy
    
      - ln -s /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 /app/lib/VESTA/libwebkit2gtk-4.0.so.37
      - ln -s /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so.0 /app/lib/VESTA/libjavascriptcoregtk-4.0.so.18 

      - install -Dm644 /app/lib/VESTA/img/logo.png /app/share/icons/hicolor/256x256/apps/org.jpminerals.VESTA.png
      - install -Dm644 org.jpminerals.VESTA.desktop /app/share/applications/org.jpminerals.VESTA.desktop
      - install -Dm644 org.jpminerals.VESTA.xml /app/share/mime/packages/org.jpminerals.VESTA.xml
    sources:
      - type: archive
        url: https://jp-minerals.org/vesta/archives/testing/VESTA-gtk3-x86_64.tar.xz
        sha256: 119af902715dc1f4f6a65b00f98ba354f57a8aac4ff8fd1cdd03d661050ec397
        strip-components: 1
      - type: file
        path: desktop/org.jpminerals.VESTA.desktop
      - type: file
        path: mime/org.jpminerals.VESTA.xml
      - type: file
        path: vesta.sh
